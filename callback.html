<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Approval received</title>
<style>body{font:16px/1.5 -apple-system,system-ui,sans-serif;max-width:32em;margin:15vh auto;padding:0 16px;color:#222;background:#fff}</style>
<h1>Approval received</h1>
<p id="s">Handing the approval to your Mac...</p>
<p>This page sends the bank's reply only to your own Mac (127.0.0.1) and stores nothing.</p>
<script>
(async function () {
  var s = document.getElementById("s");
  var q = location.search.slice(1);
  history.replaceState(null, "", location.pathname);
  if (!q) { s.textContent = "Nothing to hand over. You can close this tab."; return; }
  try {
    var r = await fetch("http://127.0.0.1:8766/cb", {method: "POST", body: q, headers: {"Content-Type": "text/plain"}});
    s.textContent = r.ok ? "Done. Your bank is connected. You can close this tab." : "Your Mac did not accept it: " + (await r.text());
  } catch (e) {
    s.textContent = "Your Mac was not listening. Tell your Life agent.";
  }
})();
</script>
